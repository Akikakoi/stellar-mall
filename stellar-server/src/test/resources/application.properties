# === 测试环境配置 ===
spring.main.allow-bean-definition-overriding=true

# 关闭 Flyway
spring.flyway.enabled=false

# 关闭 ES
stellar.elasticsearch.enabled=false

# ========================================
# H2 内存数据库（MySQL 兼容模式）
# ========================================
spring.datasource.druid.driver-class-name=org.h2.Driver
spring.datasource.druid.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=true
spring.datasource.druid.username=sa
spring.datasource.druid.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.continue-on-error=false

# ========================================
# 内嵌 Redis（embedded-redis 自动启动）
# ========================================
spring.data.redis.port=16379

# ========================================
# 基础设施占位符兜底值
# ========================================
# application.yml 里 spring.datasource.druid.* / spring.data.redis.* 引用了
# ${stellar.datasource.*} / ${stellar.redis.*}，这些值的真实来源是 application-dev.yml
# —— 该文件含密钥被 .gitignore 忽略，CI 上不存在，占位符无法解析会导致上下文启动失败
# （Failed to bind properties under 'spring.data.redis.database'）。
# 这里给出兜底值让占位符可解析；实际生效的仍是上面的 H2 / 内嵌 Redis 配置。
stellar.datasource.driver-class-name=org.h2.Driver
stellar.datasource.host=127.0.0.1
stellar.datasource.port=3306
stellar.datasource.database=stellar_mall
stellar.datasource.username=sa
stellar.datasource.password=
stellar.redis.host=127.0.0.1
stellar.redis.port=16379
stellar.redis.database=0

# ========================================
# 关闭订单过期的后台调度
# ========================================
# 事件驱动链路的 @Scheduled 入口在 enabled=false 时直接返回，避免后台线程
# 在测试期间抢跑（把用例刚入队的到期任务提前消费掉，造成断言随机失败）。
# 用例改为直接调用 pollAndPublish() / consumeOnce()，行为确定。
stellar.order.expire.enabled=false
# 对账扫描在测试里拉到 1 小时，避免它在用例中途扫走刚造的过期订单
stellar.order.expire.reconcile-interval-ms=3600000

# ========================================
# 排除不需要的自动配置
# ========================================
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.websocket.servlet.WebSocketServletAutoConfiguration
