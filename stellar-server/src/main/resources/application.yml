server:
  port: 8082

spring:
  profiles:
    active: dev
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    clean-disabled: true
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  datasource:
    druid:
      driver-class-name: ${stellar.datasource.driver-class-name}
      # 注意：MySQL 订单批量 SQL 使用 <foreach ;>，必须 allowMultiQueries=true
      url: jdbc:mysql://${stellar.datasource.host}:${stellar.datasource.port}/${stellar.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true
      username: ${stellar.datasource.username}
      password: ${stellar.datasource.password}
      # ===== 连接池显式配置 =====
      # 不配置时 Druid 默认 max-active=8：Tomcat 200 个工作线程高峰期会大量阻塞在
      # getConnection 上。显式给到 20，并配合空闲检测保活，避免 MySQL wait_timeout 断连。
      initial-size: 5
      min-idle: 5
      max-active: 20
      # 获取连接最大等待 6s，超时快速失败而不是无限堆积线程
      max-wait: 6000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      keep-alive: true
      # 空闲连接超过 5 分钟可回收，每 60s 检测一轮
      min-evictable-idle-time-millis: 300000
      time-between-eviction-runs-millis: 60000
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000
  # Redis：Spring Boot 3.x 属性前缀是 spring.data.redis（2.x 的 spring.redis 已废弃不生效）
  data:
    redis:
      host: ${stellar.redis.host}
      port: ${stellar.redis.port}
      # password: ${stellar.redis.password}
      database: ${stellar.redis.database}
      timeout: 3000
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  # 邮件（SMTP）配置：与 stellar.mail.* 联动
  mail:
    host: ${stellar.mail.host:}
    port: ${stellar.mail.port:587}
    username: ${stellar.mail.username:}
    password: ${stellar.mail.password:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # 线程池：@Async 与 @Scheduled 的池化配置
  # ⚠️ task.execution 只对「未指定执行器名」的 @Async 生效。本项目自定义了 Executor Bean
  # （见 AsyncExecutorConfig / BehaviorExecutorConfig），Spring Boot 的默认
  # applicationTaskExecutor 因此不再创建，业务 @Async 一律显式写执行器名；
  # 这里保留兜底配置，防止将来新增未命名的 @Async 时退化到 SimpleAsyncTaskExecutor
  # —— 那个执行器每次调用都新建线程且无上限，是典型的线程耗尽来源。
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 500
      thread-name-prefix: stellar-async-
      shutdown:
        await-termination: true
        await-termination-period: 30s
    # 定时任务调度池：默认池只有 1 个线程，订单过期扫描 / RAG outbox 同步 / 优惠券提醒
    # 会串行抢同一个线程 —— 任一轮阻塞就会整体推迟其余定时任务。
    scheduling:
      pool:
        size: 4
      thread-name-prefix: stellar-sched-
      shutdown:
        await-termination: true
        await-termination-period: 30s

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.stellar.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com:
      stellar:
        mapper: debug
        service: info
        controller: info

# ======== 星耀商城自定义配置 ========
stellar:
  # CORS 跨域：允许的来源域名（逗号分隔），dev 默认 *，prod 须显式指定
  cors:
    allowed-origins: ${STELLAR_CORS_ALLOWED_ORIGINS:*}
  jwt:
    # 管理端员工 token 密钥（≥32 强密钥，和 RAG 端 STELLAR_ADMIN_SECRET_KEY 完全一致！）
    admin-secret-key: ${STELLAR_ADMIN_SECRET_KEY:CHANGE_ME_ADMIN_JWT_SECRET_AT_LEAST_32_CHARS}
    # 管理端 access token TTL（毫秒，30 分钟 = 1800000）
    admin-ttl: 1800000
    # 管理端前端传递 token 的 header 名
    admin-token-name: token
    # 管理端 refresh token TTL（毫秒，12 小时 = 43200000）
    admin-refresh-ttl: 43200000
    # C 端用户 token 密钥（≥32，和 RAG 端 STELLAR_USER_SECRET_KEY 完全一致！）
    user-secret-key: ${STELLAR_USER_SECRET_KEY:CHANGE_ME_USER_JWT_SECRET_AT_LEAST_32_CHARS}
    # C 端 access token TTL（毫秒，2 小时 = 7200000）
    user-ttl: 7200000
    user-token-name: authentication
    # C 端 refresh token TTL（毫秒，30 天 = 2592000000）
    user-refresh-ttl: 2592000000
  # 阿里云 OSS（和 RAG 共用一个桶，目录前缀 stellar-mall/）
  alioss:
    endpoint: ${STELLAR_OSS_ENDPOINT:}
    access-key-id: ${STELLAR_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${STELLAR_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${STELLAR_OSS_BUCKET:}
  # RAG 同步配置（Java → RAG 内部接口共享密钥）
  rag:
    base-url: ${STELLAR_RAG_BASE_URL:http://127.0.0.1:8000}
    internal-sync-secret: ${STELLAR_RAG_INTERNAL_SYNC_SECRET:CHANGE_ME_RAG_SYNC_SECRET}
  # 邮件发送（邮箱验证码）
  # enabled=true 走真实 SMTP 发送；enabled=false（默认）为开发模式，
  # 不真实发信，接口直接返回验证码方便本地调试
  mail:
    enabled: ${STELLAR_MAIL_ENABLED:false}
    host: ${STELLAR_MAIL_HOST:}
    port: ${STELLAR_MAIL_PORT:587}
    username: ${STELLAR_MAIL_USERNAME:}
    password: ${STELLAR_MAIL_PASSWORD:}
  # Elasticsearch 搜索配置
  elasticsearch:
    enabled: true
    uris: http://127.0.0.1:9200
    connect-timeout: 5000
    socket-timeout: 60000
    index-prefix: stellar
    # 语义向量维度：必须与 rag-backend /api/embed 实际返回一致。
    # 1536 = DashScope text-embedding-v2（云端优先）；本地 bge-large-zh-v1.5 为 1024。
    # 注意 dense_vector 建好后 dims 不可改，切换模型需删索引后重建（管理端 /admin/es/rebuild 前先删索引）。
    vector-dim: 1536

  # 订单超时自动取消：延迟消息 + Streams 消费组（事件驱动），对账扫描兜底
  order:
    expire:
      # true=下单登记延迟任务，到期投递 Stream 由消费组取消；false=仅靠低频对账扫描
      enabled: ${STELLAR_ORDER_EXPIRE_ENABLED:true}
      # 订单超时时间（分钟）⚠️ 必须与 OrderServiceImpl.ORDER_EXPIRE_MINUTES 保持一致
      delay-minutes: 15
      # 对账兜底扫描间隔（毫秒）：事件驱动开启时可放长，关闭时调成 30000 即等价旧轮询方案
      reconcile-interval-ms: 600000
      # 到期扫描间隔（毫秒）与单轮批量
      poll-interval-ms: 1000
      poll-batch-size: 200
      # 消费组相关
      consume-batch-size: 50
      # 应大于正常整批处理耗时，避免过早接管正在执行的消息
      claim-min-idle-ms: 60000
