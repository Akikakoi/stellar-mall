<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品规格选择器 - 演示</title>
  <style>
    :root {
      --spec-active: #ff6700;
      --spec-active-soft: rgba(255, 103, 0, 0.08);
      --bg-base: #f5f5f7;
      --bg-card: #ffffff;
      --border-base: #d2d2d7;
      --border-subtle: #e8e8ed;
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --text-muted: #6e6e73;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 28px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      padding: 40px 20px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    h1 { font-size: 22px; margin-bottom: 24px; font-weight: 600; }
    .spec-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .spec-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: var(--text-muted);
    }
    .spec-label .toggle { font-size: 13px; color: var(--text-secondary); cursor: pointer; }
    .spec-options { display: flex; flex-wrap: wrap; gap: 10px; }
    .spec-option {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      min-height: 36px;
      border: 1px solid var(--border-base);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .spec-option:hover { border-color: var(--spec-active); color: var(--text-primary); }
    .spec-option.active {
      border-color: var(--spec-active);
      background: var(--spec-active-soft);
      color: var(--spec-active);
      font-weight: 500;
    }
    .spec-option.has-image { padding: 4px 12px 4px 4px; }
    .option-image { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; background: var(--bg-base); }
    .option-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      background: var(--spec-active);
      white-space: nowrap;
    }
    .summary { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
    .summary strong { color: var(--text-primary); font-weight: 500; }
    .qty-control { display: inline-flex; align-items: center; }
    .qty-btn {
      width: 36px; height: 36px;
      border: 1px solid var(--border-base); background: var(--bg-card); color: var(--text-primary);
      font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .qty-btn:first-child { border-radius: var(--radius-md) 0 0 var(--radius-md); }
    .qty-btn:last-child { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
    .qty-input {
      width: 56px; height: 36px; border: 1px solid var(--border-base); border-left: none; border-right: none;
      text-align: center; font-size: 14px; background: var(--bg-card); outline: none;
    }
    .stock-hint { margin-left: 12px; font-size: 13px; color: var(--text-muted); }
    .service-trigger {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 14px; color: var(--text-primary); cursor: pointer;
    }
    .service-list { display: none; flex-direction: column; gap: 8px; padding-top: 8px; }
    .service-list.open { display: flex; }
    .service-option {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 12px; border: 1px solid var(--border-base); border-radius: var(--radius-md);
      background: var(--bg-card); cursor: pointer; width: fit-content; font-size: 14px;
    }
    .service-option.active { border-color: var(--spec-active); background: var(--spec-active-soft); }
    .service-price { color: var(--spec-active); font-weight: 500; }
    .price-tag { font-size: 32px; font-weight: 700; color: var(--text-primary); margin-bottom: 24px; }
    .notice { margin-top: 24px; padding: 12px; background: var(--spec-active-soft); border-radius: var(--radius-md); font-size: 13px; color: var(--spec-active); }
  </style>
</head>
<body>
  <div class="container">
    <h1>星耀 S60 5G 智能手机</h1>
    <div class="price-tag" id="price">¥2999.00</div>

    <!-- 版本 -->
    <div class="spec-row">
      <div class="spec-label">版本</div>
      <div class="spec-options" id="version"></div>
    </div>

    <!-- 机身颜色 -->
    <div class="spec-row">
      <div class="spec-label">
        <span>机身颜色</span>
        <span class="toggle" onclick="toggleImageMode()">切换大图模式</span>
      </div>
      <div class="spec-options image-mode" id="color"></div>
    </div>

    <!-- 存储容量 -->
    <div class="spec-row">
      <div class="spec-label">存储容量</div>
      <div class="spec-options" id="storage"></div>
    </div>

    <!-- 套餐类型 -->
    <div class="spec-row">
      <div class="spec-label">套餐类型</div>
      <div class="spec-options" id="package"></div>
    </div>

    <div class="summary" id="summary">已选：S60 24期分期免息 / 星星海 / 12GB+256GB / 官方标配</div>

    <!-- 数量 -->
    <div class="spec-row">
      <div class="spec-label">数量</div>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <input class="qty-input" id="qty" type="number" value="1" min="1" max="2" onchange="validateQty()" />
        <button class="qty-btn" onclick="changeQty(1)">+</button>
        <span class="stock-hint">有货(限购2件)</span>
      </div>
    </div>

    <!-- 保障服务 -->
    <div class="spec-row">
      <div class="spec-label">保障服务</div>
      <div>
        <div class="service-trigger" onclick="toggleServices()">
          <span>选购更多</span>
          <span id="arrow">▼</span>
        </div>
        <div class="service-list" id="services">
          <label class="service-option" onclick="this.classList.toggle('active'); updatePrice()">
            <input type="checkbox" style="accent-color:#ff6700" />
            <span>碎屏险 · 1年</span>
            <span class="service-price">¥99.00</span>
          </label>
          <label class="service-option" onclick="this.classList.toggle('active'); updatePrice()">
            <input type="checkbox" style="accent-color:#ff6700" />
            <span>延长保修 · 2年</span>
            <span class="service-price">¥159.00</span>
          </label>
        </div>
      </div>
    </div>

    <div class="notice">提示：这是静态演示页，用于展示规格选择器样式。实际项目已集成到 /spu/:id 商品详情页。</div>
  </div>

  <script>
    const data = {
      version: ['S60 24期分期免息', 'S60 赠蓝牙耳机+移动电源', 'S60元气版 24期分期免息', 'S60元气版 赠蓝牙耳机+移动电源'],
      color: [
        { value: '星星海', img: 'https://picsum.photos/seed/stars/100/100', badge: '万人加购' },
        { value: '初夏绿', img: 'https://picsum.photos/seed/green/100/100' },
        { value: '仲夏夜', img: 'https://picsum.photos/seed/night/100/100' }
      ],
      storage: ['12GB+256GB', '16GB+256GB', '12GB+512GB', '16GB+512GB'],
      package: ['官方标配']
    };

    const prices = {
      '12GB+256GB': 2999,
      '16GB+256GB': 3299,
      '12GB+512GB': 3499,
      '16GB+512GB': 3999
    };

    const state = {
      version: data.version[0],
      color: data.color[0].value,
      storage: data.storage[0],
      package: data.package[0]
    };

    function render() {
      renderGroup('version', data.version, false);
      renderColorGroup();
      renderGroup('storage', data.storage, false);
      renderGroup('package', data.package, false);
      updatePrice();
    }

    function renderGroup(key, list, withImage) {
      const el = document.getElementById(key);
      el.innerHTML = list.map(item => {
        const value = typeof item === 'string' ? item : item.value;
        const active = state[key] === value ? 'active' : '';
        return `<button class="spec-option ${active}" onclick="setState('${key}', '${value}')">${value}</button>`;
      }).join('');
    }

    function renderColorGroup() {
      const el = document.getElementById('color');
      const big = el.classList.contains('image-mode');
      el.innerHTML = data.color.map(item => {
        const active = state.color === item.value ? 'active' : '';
        const imgSize = big ? 48 : 32;
        const badge = item.badge ? `<span class="option-badge">${item.badge}</span>` : '';
        return `<button class="spec-option has-image ${active}" onclick="setState('color', '${item.value}')">
          ${badge}
          <img class="option-image" src="${item.img}" width="${imgSize}" height="${imgSize}" alt="" />
          <span>${item.value}</span>
        </button>`;
      }).join('');
    }

    function setState(key, value) {
      state[key] = value;
      render();
    }

    function toggleImageMode() {
      document.getElementById('color').classList.toggle('image-mode');
      renderColorGroup();
    }

    function updatePrice() {
      const base = prices[state.storage] || 2999;
      let extra = 0;
      document.querySelectorAll('.service-option.active input').forEach((inp, idx) => {
        extra += idx === 0 ? 99 : 159;
      });
      const total = (base + extra) * Number(document.getElementById('qty').value);
      document.getElementById('price').textContent = '¥' + total.toLocaleString('zh-CN', { minimumFractionDigits: 2 });
      document.getElementById('summary').innerHTML = `已选：<strong>${state.version} / ${state.color} / ${state.storage} / ${state.package}</strong>`;
    }

    function changeQty(delta) {
      const input = document.getElementById('qty');
      let v = Number(input.value) + delta;
      v = Math.max(1, Math.min(v, 2));
      input.value = v;
      updatePrice();
    }

    function validateQty() {
      const input = document.getElementById('qty');
      let v = Number(input.value) || 1;
      v = Math.max(1, Math.min(v, 2));
      input.value = v;
      updatePrice();
    }

    function toggleServices() {
      const list = document.getElementById('services');
      const arrow = document.getElementById('arrow');
      list.classList.toggle('open');
      arrow.textContent = list.classList.contains('open') ? '▲' : '▼';
    }

    render();
  </script>
</body>
</html>
