# =========================================================================
# 星耀商城 stellar-mall — Docker Compose 基础设施
# 一键启动：docker compose up -d
# 停止：    docker compose down
# 清理数据：docker compose down -v   （会删除所有持久化数据！）
#
# ⚠️ 本文件仅用于本地开发，禁止用于生产。
#    MySQL 不在本文件内，使用本机自行安装的 MySQL 8.0（默认 127.0.0.1:3306）。
# =========================================================================

services:
  # ======================== Elasticsearch 8.13 ========================
  elasticsearch:
    # ES 8 使用独立数据卷，保留旧 ES 与 Redis 数据；启动后调用 /admin/es/rebuild。
    build:
      context: ./docker
      dockerfile: Dockerfile.es
    image: stellar-es:8.13.4
    container_name: stellar-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - "TZ=Asia/Shanghai"
    ports:
      - "9200:9200"
    volumes:
      - es8-data:/usr/share/elasticsearch/data
    networks:
      - stellar-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # ======================== Redis 7 ========================
  redis:
    image: redis:7.2-alpine
    container_name: stellar-redis
    command:
      - redis-server
      - --appendonly yes
      - --databases 16
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379" # 原来是   - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - stellar-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

# ======================== 持久化卷 ========================
volumes:
  es8-data:
  redis-data:

# ======================== 共享网络 ========================
networks:
  stellar-net:
    driver: bridge
